# Snapshots traffic every day, because GitHub keeps only 14 days of it.
#
# The 14-day judgement on this venture reads numbers that expire. Running the
# snapshot by hand means the window is only as complete as someone's memory of
# it, and a gap in the middle is not recoverable afterwards.

name: Snapshot traffic

on:
  schedule:
    - cron: "10 20 * * *"   # 05:10 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run metrics
      - name: Commit if anything changed
        run: |
          git config user.name  keihyo-cases
          git config user.email noreply@github.com
          git add metrics
          git diff --cached --quiet && { echo "変化なし"; exit 0; }
          git commit -m "Snapshot traffic $(date -u +%Y-%m-%d)"
          git push
